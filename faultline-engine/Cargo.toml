[package]
name = "faultline-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Low-level Aya and TC eBPF engine for network fault sessions"
autobins = false

[[bin]]
name = "faultline-engine"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, default-features = true }
aya.workspace = true
faultline-common = { path = "../faultline-common", features = ["user"] }
faultline-protocol = { path = "../faultline-protocol" }
clap = { workspace = true, features = ["derive"] }
env_logger.workspace = true
ipnet = { workspace = true, default-features = true, features = ["serde"] }
libc.workspace = true
log.workspace = true
rmp-serde.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
yaml_serde = { workspace = true, default-features = true }

[build-dependencies]
anyhow.workspace = true
aya-build.workspace = true
cargo_metadata.workspace = true
faultline-ebpf = { path = "../faultline-ebpf" }
object.workspace = true
