[tools]
cargo-binstall = "latest"

[tasks.setup]
description = "Install the Rust toolchains and bpf-linker required by Aya"
run = """
rustup toolchain install stable --component rust-src
rustup toolchain install nightly --component rust-src
cargo binstall --no-confirm bpf-linker
"""

[tasks.check]
description = "Format-check and compile the userspace and eBPF programs"
run = """
cargo fmt --all -- --check
cargo check
"""

[tasks.lint-userspace]
description = "Run Clippy for host-side workspace targets"
run = "cargo clippy --workspace --all-targets --exclude faultline-ebpf -- -D warnings"

[tasks.lint-ebpf]
description = "Run Clippy for the eBPF program with its nightly target"
run = "cargo +nightly clippy -Z build-std=core --target bpfel-unknown-none -p faultline-ebpf --bin flt -- -D warnings"

[tasks.lint]
description = "Run userspace and eBPF Clippy checks"
depends = ["lint-userspace", "lint-ebpf"]

[tasks.build]
description = "Build an optimized faultline-engine binary"
run = "cargo build --release -p faultline-engine -p faultline-lab"

[tasks."build-tui"]
description = "Build the portable Faultline controller and Linux stdio agent"
run = "cargo build --release -p faultline -p faultline-agent"

[tasks."build-agent-image"]
description = "Build the ephemeral Docker network-namespace agent image"
depends = ["build", "build-tui"]
run = "docker build -f packaging/agent.Dockerfile -t faultline-agent:latest ."

[tasks.test]
description = "Run tests that do not require eBPF privileges"
run = "cargo test --workspace"

[tasks.test-root]
description = "Run kernel BPF_PROG_TEST_RUN integration tests"
run = '''
build_output=$(cargo test -p faultline-engine --test bpf_test_run --no-run 2>&1)
printf '%s\n' "$build_output"
test_binary=$(printf '%s\n' "$build_output" | sed -n 's/.*Executable tests\/bpf_test_run.rs (\(.*\))/\1/p' | tail -n 1)
if [ -z "$test_binary" ]; then
  echo "could not locate the bpf_test_run executable" >&2
  exit 1
fi
./scripts/lab/sudo.sh "$test_binary" --ignored --nocapture
'''

[tasks."lab:pbt"]
description = "Run generated GSO skb sequences against the kernel dataplane model"
run = '''
build_output=$(cargo test -p faultline-engine --test dataplane_pbt --no-run 2>&1)
printf '%s\n' "$build_output"
test_binary=$(printf '%s\n' "$build_output" | sed -n 's/.*Executable tests\/dataplane_pbt.rs (\(.*\))/\1/p' | tail -n 1)
if [ -z "$test_binary" ]; then
  echo "could not locate the dataplane_pbt executable" >&2
  exit 1
fi
pbt_seed=${FAULTLINE_PBT_SEED:-0x7062745f67736f00}
pbt_cases=${FAULTLINE_PBT_CASES:-256}
if [ -n "${FAULTLINE_PBT_CASE:-}" ]; then
  ./scripts/lab/sudo.sh env FAULTLINE_PBT_SEED="$pbt_seed" FAULTLINE_PBT_CASES="$pbt_cases" FAULTLINE_PBT_CASE="$FAULTLINE_PBT_CASE" "$test_binary" --ignored --nocapture
else
  ./scripts/lab/sudo.sh env FAULTLINE_PBT_SEED="$pbt_seed" FAULTLINE_PBT_CASES="$pbt_cases" "$test_binary" --ignored --nocapture
fi
'''

[tasks."lab:pbt-long"]
description = "Run 10,000 generated GSO skb sequence cases"
run = "FAULTLINE_PBT_CASES=10000 mise run lab:pbt"

[tasks."lab:unit"]
description = "Run faultline-lab socket unit tests outside restricted sandboxes"
run = "cargo test -p faultline-lab --bin faultline-lab"

[tasks."lab:unit-sockets"]
description = "Run all userspace unit tests that require local sockets outside restricted sandboxes"
run = "cargo test -p faultline-lab --bin faultline-lab -p faultline-engine --bin faultline-engine"

[tasks."lab:unit-workspace"]
description = "Run the complete userspace workspace test suite outside restricted sandboxes"
run = "cargo test --workspace --exclude faultline-ebpf"

[tasks."lab:install"]
description = "Install the Debian packages required by the standard LXC lab"
run = "./scripts/lab/sudo.sh ./scripts/lab/install.sh"

[tasks."lab:up"]
description = "Create and start the LXC client/server lab"
depends = ["build"]
run = "./scripts/lab/sudo.sh ./scripts/lab/up.sh"

[tasks."lab:baseline"]
description = "Run 100 TCP requests without fault injection"
depends = ["lab:up"]
run = "./scripts/lab/sudo.sh ./scripts/lab/baseline.sh"

[tasks."lab:loss"]
description = "Run the standard deterministic hash-based 50% loss scenario"
depends = ["lab:up"]
run = "./scripts/lab/sudo.sh ./scripts/lab/loss.sh"

[tasks."lab:loss-random"]
description = "Run the standard random 50% packet-loss scenario"
depends = ["lab:up"]
run = "./scripts/lab/sudo.sh env LOSS_ALGORITHM=random ./scripts/lab/loss.sh"

[tasks."lab:scenario"]
description = "Run a multiple-rule source-specific scenario"
depends = ["lab:up"]
run = "./scripts/lab/sudo.sh env SCENARIO=./scenarios/lab.yaml ./scripts/lab/loss.sh"

[tasks."lab:test"]
description = "Run all LXC loss and queue-impairment scenarios, then stop the lab"
depends = ["build"]
run = "./scripts/lab/sudo.sh ./scripts/lab/test.sh"

[tasks."lab:impairments"]
description = "Run delay, jitter, duplication, reordering, bandwidth, burst, and outage scenarios"
depends = ["lab:up"]
run = "./scripts/lab/sudo.sh ./scripts/lab/impairments.sh"

[tasks."lab:offload"]
description = "Compare real veth upload behavior with GSO/TSO/GRO disabled and enabled"
depends = ["lab:up"]
run = './scripts/lab/sudo.sh env UPLOAD_BYTES="${UPLOAD_BYTES:-8388608}" LOSS_PERCENT="${LOSS_PERCENT:-2}" ./scripts/lab/offload.sh'

[tasks."lab:load"]
description = "Measure concurrent LXC uploads under pass, loss, and bandwidth rules"
depends = ["lab:up"]
run = './scripts/lab/sudo.sh env LAB_LOAD_WORKERS="${LAB_LOAD_WORKERS:-8}" LAB_LOAD_SECONDS="${LAB_LOAD_SECONDS:-10}" python3 ./scripts/lab/load.py'

[tasks."lab:soak"]
description = "Soak live rule updates, slow observers, source precedence and agent cleanup"
depends = ["lab:up", "build-tui"]
run = './scripts/lab/sudo.sh env LAB_SOAK_SECONDS="${LAB_SOAK_SECONDS:-120}" python3 ./scripts/lab/soak.py'

[tasks."lab:soak-agent"]
description = "Verify agent cleanup under traffic, closed pipes and stdout backpressure"
depends = ["lab:up", "build-tui"]
run = './scripts/lab/sudo.sh python3 ./scripts/lab/soak.py --agent-only'

[tasks."lab:control"]
description = "Exercise live Unix socket rule updates and pushed stats against the LXC dataplane"
depends = ["lab:up", "build-tui"]
run = "./scripts/lab/sudo.sh ./scripts/lab/control.sh"

[tasks."lab:agent"]
description = "Verify a TUI-owned stdio agent applies faults only for the session lifetime"
depends = ["lab:up", "build-tui"]
run = "./scripts/lab/sudo.sh ./scripts/lab/agent.sh"

[tasks."lab:agent-lxc"]
description = "Spawn the stdio agent inside an LXC network namespace and verify cleanup"
depends = ["lab:up", "build-tui"]
run = "./scripts/lab/sudo.sh ./scripts/lab/agent_lxc.sh"

[tasks."lab:agent-docker"]
description = "Verify the Docker namespace agent applies faults and preserves the target lifecycle"
depends = ["lab:up", "build-agent-image"]
run = "./scripts/lab/sudo.sh ./scripts/lab/agent_docker.sh"

[tasks."lab:traffic"]
description = "Continuously send client-to-server traffic while exercising the live TUI"
depends = ["lab:up"]
run = "./scripts/lab/sudo.sh ./scripts/lab/traffic.sh"

[tasks."lab:profile"]
description = "Verify a timed profile applies outage and recovery phases atomically"
depends = ["lab:up", "build-tui"]
run = "./scripts/lab/sudo.sh ./scripts/lab/profile.sh"

[tasks."lab:tui"]
description = "Render live LXC stats through the headless TUI TestBackend adapter"
depends = ["lab:up", "build-tui"]
run = "./scripts/lab/sudo.sh ./scripts/lab/tui_snapshot.sh"

[tasks."lab:experiment"]
description = "Run a manifest-built LXC experiment with owned traffic and render its observed state"
depends = ["lab:up", "build-tui"]
run = "./scripts/lab/sudo.sh ./scripts/lab/experiment.sh"

[tasks."lab:down"]
description = "Stop the LXC lab and remove its bridge"
run = "./scripts/lab/sudo.sh ./scripts/lab/down.sh"

[tasks."lab:clean"]
description = "Stop and destroy only the faultline LXC lab containers"
run = "./scripts/lab/sudo.sh ./scripts/lab/clean.sh"

[tasks.run]
description = "Show faultline-engine help (loading eBPF requires root)"
depends = ["build"]
run = "./target/release/faultline-engine --help"
